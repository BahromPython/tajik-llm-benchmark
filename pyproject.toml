[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tajik-llm-benchmark"
version = "0.1.0"
description = "Reproducible benchmark pipeline for Tajik-language LLM evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tajik-bench = "tajik_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

